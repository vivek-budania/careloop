[project]
name = "careloop"
version = "0.1.0"
description = "Mocked US patient-journey demo (FastAPI + vanilla JS)"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (local: pip install -r requirements.txt).
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "groq==1.2.0",
    "python-dotenv==1.0.1",
    "pydantic==2.9.0",
    "python-multipart==0.0.12",
    "sumy==0.11.0",
    "nltk==3.9.1",
    "certifi>=2024.0.0",
    "fpdf2==2.8.3",
]

# Vercel looks for app.py / main.py at the repo root (or under src/, app/, api/).
# CareLoop's FastAPI instance lives in backend/main.py as `app`.
[tool.vercel]
entrypoint = "backend.main:app"
